<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Gradient (Porto Seguro Auto Blue) -->
    <linearGradient id="mmBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00A1FC" />
      <stop offset="100%" stop-color="#062356" />
    </linearGradient>
    <!-- Cyan Gradient for second M -->
    <linearGradient id="m2Grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
  </defs>
  <!-- Squircle Base -->
  <rect width="64" height="64" rx="16" fill="url(#mmBg)" />
  <!-- Gloss / Inset stroke -->
  <rect x="1" y="1" width="62" height="62" rx="15" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="1.5" />
  
  <g transform="skewX(-8) translate(4.5, 0)">
    <!-- M 1 (Melhores - White) -->
    <path d="M 12.5 45.5 L 12.5 18.5 L 21.5 33 L 30.5 18.5 L 30.5 45.5" 
          fill="none" 
          stroke="#FFFFFF" 
          stroke-width="4.6" 
          stroke-linecap="round" 
          stroke-linejoin="round" />
          
    <!-- M 2 (Mecânicos - Electric Cyan) -->
    <path d="M 34.5 45.5 L 34.5 18.5 L 43.5 33 L 52.5 18.5 L 52.5 45.5" 
          fill="none" 
          stroke="#38BDF8" 
          stroke-width="4.6" 
          stroke-linecap="round" 
          stroke-linejoin="round" />
  </g>
</svg>